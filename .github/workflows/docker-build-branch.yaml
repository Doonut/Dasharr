name: Docker Build Branch

# This workflow builds Docker images and pushes to GHCR
# It's on a separate branch to avoid adding it to the PR
# To use: merge your add-all-trackers-support changes into this branch, then push
on:
  push:
    branches:
      - docker-workflow
  workflow_dispatch: # Allow manual triggering from GitHub Actions UI

# cancel any previously-started, yet still active runs of this workflow on the same branch
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  call-docker-build:
    name: Call Docker Build

    uses: Arcadia-Solutions/Dasharr/.github/workflows/reusable-docker-build.yaml@main

    # set permissions here to be equal or greater than what's required in the Reusable Workflow
    # Permisions set here for the GITHUB_TOKEN are then passed to the Reusable Workflow
    # Calling permissions must be equal to or greater than these reusable permissions for it to work
    # https://docs.github.com/en/actions/using-workflows/reusing-workflows#supported-keywords-for-jobs-that-call-a-reusable-workflow
    permissions:
      contents: read
      packages: write # needed to push docker image to ghcr.io
      pull-requests: write # needed to create and update comments in PRs

    with:
      ghcr-enable: true

      image-names: |
        ghcr.io/${{ github.repository }}

      # Tag as 'latest' so you can pull ghcr.io/Doonut/dasharr:latest
      # Also tag with branch name for specific version tracking
      tag-rules: |
        type=raw,value=latest,priority=100
        type=raw,value=add-all-trackers-support,priority=200
        type=raw,value=add-all-trackers-support-{{sha}},priority=300

      platforms: linux/amd64,linux/arm64

      comment-enable: false

